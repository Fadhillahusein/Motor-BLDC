; Copy of RAMA's working platformio.ini (the benchmark). Only monitor_port is changed to YOUR COM port.
; monitor_speed MUST equal Serial.begin() in the code:
;   Rama's code      -> Serial.begin(1000000) -> monitor_speed = 1000000
;   our own main.cpp -> Serial.begin(115200)  -> change monitor_speed to 115200

[env:disco_b_g431b_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 1000000
monitor_filters = log2file
monitor_port = COM7           ; your ST-LINK port (Rama has COM12)
lib_archive = false
lib_deps =
	askuric/Simple FOC@^2.4.0
	simplefoc/SimpleFOCDrivers@^1.0.9
build_flags =
	-D HAL_OPAMP_MODULE_ENABLED